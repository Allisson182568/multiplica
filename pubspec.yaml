name: grupo_dantas
description: Sistema de Gestão de Incorporação — Grupo Dantas
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.5.6

  # Navegação
  go_router: ^13.2.0

  # Estado
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  excel: ^4.0.6

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  fl_chart: ^0.68.0
  percent_indicator: ^4.2.3
  timeline_tile: ^2.0.0

  # Utilitários
  intl: ^0.19.0
  uuid: ^4.4.0
  image_picker: ^1.1.2
  file_picker: ^8.0.3
  share_plus: ^9.0.0
  url_launcher: ^6.3.0
  timeago: ^3.6.1

  # Storage / Cache
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # Ícones
  hugeicons: ^0.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  # Caminhos relativos corrigidos (sem o caminho absoluto do seu Mac)
  assets:
    - assets/images/
    - assets/images/logo.png

